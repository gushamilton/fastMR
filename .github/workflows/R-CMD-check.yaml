name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    env:
      COMPRESSOR_PYTHON: python3
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        r: [release]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pcodec runtime
        run: python3 -m pip install 'numpy==1.26.4' 'pcodec==1.0.3' 'zstandard==0.25.0'

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            github::gushamilton/CompreSSoR@a67fee0d9b95aeaba7526ed8ded56561be88bf40
          needs: check

      - name: Verify CompreSSoR 0.6 native fixture dependency
        run: >-
          Rscript -e
          'stopifnot(utils::packageVersion("CompreSSoR") >= "0.6.0")'

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          upload-snapshots: true
